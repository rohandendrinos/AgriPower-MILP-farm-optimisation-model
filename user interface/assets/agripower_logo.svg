          fill="#0b5fff" fill-rule="evenodd"/>
  </g>
  <text x="48" y="29" font-family="Inter, 'Segoe UI', sans-serif" font-size="19" font-weight="800" fill="#211e17">Agri<tspan fill="#0b5fff">Power</tspan></text>
