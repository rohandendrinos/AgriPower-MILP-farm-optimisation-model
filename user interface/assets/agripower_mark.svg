<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <!-- Livestock shed: a long low farm building with a big pitched roof.
       The roof is rendered as two solid gold panel planes, because the
       roof is exactly what the optimiser fills with solar. The blue shed
       body carries a barn-door cut-out so the shape reads as a farm
       building, not a house. One idea: shed + solar roof. -->
  <path d="M19 7 L4 20 L19 20 Z" fill="#a6790a"/>
  <path d="M21 7 L36 20 L21 20 Z" fill="#a6790a"/>
  <path d="M5 20 L35 20 L35 34 L5 34 Z M16 34 L16 27 A4.5 4.5 0 0 1 24 27 L24 34 Z"
        fill="#0b5fff" fill-rule="evenodd"/>
</svg>
